[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "2.0.0"
description = "JARVIS AI Assistant - Multi-agent system with CLI interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OEvortex", email = "koulabhay25@gmail.com"}
]
keywords = ["ai", "assistant", "agent", "llm", "anthropic", "openai", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core dependencies
    "pydantic>=2.5.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=14.0.0",
    "tomli-w>=1.2.0",
    "curl-cffi>=0.7.0",
    "aiofiles>=24.1.0",
    # LLM Providers (using curl_cffi)
    # Async support
    # Configuration
    # Embeddings (optional)
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    # Additional providers
    "openai>=1.54.0",
    # PDF support
    "PyPDF2>=3.0.1",
    # Token counting
    "tiktoken>=0.7.0",
    # CLI dependencies
    "prompt-toolkit>=3.0.0",
    "pygments>=2.16.0",
    # TUI dependencies
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "ty>=0.0.33",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.urls]
Homepage = "https://github.com/OEvortex/JARVIS"
Repository = "https://github.com/OEvortex/JARVIS"
Issues = "https://github.com/OEvortex/JARVIS/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "jarvis*", "interface*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["core"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
